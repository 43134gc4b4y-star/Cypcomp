name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0 (compatible; CompareCyprusBot/1.0)" "https://www.unimarmarket.com/Urun/bafra_sizma_zey_yagi_1lt" -o p.html
          python3 - <<'PY'
          import re
          h=open('p.html',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'(fiyat|price|TL|₺)', h, re.I):
              s=h[max(0,m.start()-250):m.end()+150].replace('\n',' ')
              print('...', re.sub(r'\s+',' ',s)); print()
              if m.start()>200000: break
          PY
