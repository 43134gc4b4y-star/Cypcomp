name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; CompareCyprusBot/1.0)"
          A=https://www.e-kalathi.gov.cy/ekalathi-website-server/api/retail/fetch-retail-branch-list
          curl -s -A "$UA" "$A?productId=34&page=0&size=3" -o r.json -w "bytes=%{size_download}\n"
          jq -c '{totalElements,totalPages,size,last} ' r.json
          jq -c '.content[0]|del(.companyPhotoFile)' r.json
          jq -c '.content[]|del(.companyPhotoFile)|{name,companyName,price,productPrice,distance}' r.json
          for s in "PRICE,ASC" "price,ASC" "PRODUCT_PRICE,ASC" "DEFAULT,ASC" "PRODUCT_START_PRICE,ASC"; do
            echo "--- sort=$s"; curl -s -A "$UA" "$A?productId=34&page=0&size=5&sort=$s" | jq -c '[.content[]?|del(.companyPhotoFile)|(.companyName+" "+((.price//.productPrice//.finalPrice//"?")|tostring))]' 2>&1 | head -c 600; echo
          done
          curl -s -A "$UA" "$A?productId=34&page=0&size=300" -o all.json -w "all bytes=%{size_download}\n"
          jq -c '{n:(.content|length), total:.totalElements}' all.json
          jq -r '.content[]|del(.companyPhotoFile)|[.companyName, (.. |numbers|tostring)]|@tsv' all.json | head -5
