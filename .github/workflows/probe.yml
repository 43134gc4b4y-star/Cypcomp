name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; CompareCyprusBot/1.0)"
          curl -s -A "$UA" https://fetch.com.cy/robots.txt | head -40
          echo "=== supermarket-like stores"
          curl -s -A "$UA" https://fetch.com.cy/sitemap-stores.xml | grep -o 'fetch.com.cy/s/[^<]*' | grep -iE "super|market|mas-|athien|kkolias|stelios|alphamega|sklaven|lidl|metro|ioannid|kokkinos|philippos|smart|discount|poplife|sypal|lysiotis|papas|minimarket|grocery|fresh" | head -60
          S=https://fetch.com.cy/s/theoklitos-zorpas-o-athienitis
          curl -sL -A "$UA" $S -o s.html; echo "store page bytes $(wc -c < s.html)"
          python3 - <<'PY'
          import re
          h=open('s.html',encoding='utf-8',errors='ignore').read()
          print('product links', len(set(re.findall(r'href="(/p/[^"]+)"',h))))
          print(sorted(set(re.findall(r'href="(/p/[^"]+)"',h)))[:5])
          print('euro prices', re.findall(r'€\s?\d+[.,]\d{2}|\d+[.,]\d{2}\s?€',h)[:10])
          for s in re.findall(r'<script type="application/ld\+json"[^>]*>(.*?)</script>',h,re.S)[:4]: print('LD', s[:400])
          m=re.findall(r'"price":\s?"?([\d.]+)',h); print('price fields', len(m), m[:10])
          print('next links', sorted(set(re.findall(r'href="([^"]*(?:page=|/c/)[^"]*)"',h)))[:10])
          i=h.find('"products"'); print('products ctx', h[i:i+600] if i>0 else 'none')
          PY
