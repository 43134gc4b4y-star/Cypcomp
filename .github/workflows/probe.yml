name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="CompareCyprusBot/1.0 (+https://github.com/43134gc4b4y-star/Cypcomp)"
          B=https://prices.openfoodfacts.org
          curl -s -A "$UA" "$B/robots.txt" | head -20; echo
          for q in "locations?osm_address_country__like=Cyprus&size=100" "locations?osm_address_country__like=K%C3%BDpros&size=100" "locations?osm_address_country_code=CY&size=100"; do
            echo "== $q"; curl -s -A "$UA" "$B/api/v1/$q" | python3 -c "
          import sys,json
          try:
              d=json.load(sys.stdin); print('total',d.get('total'))
              for l in d.get('items',[])[:100]: print(l.get('id'),l.get('osm_name'),'|',l.get('osm_address_city'),'|',l.get('osm_address_country'),'| prices',l.get('price_count'))
          except Exception as e: print('ERR',e)"
          done
