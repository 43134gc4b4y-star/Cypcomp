name: Daily prices

on:
  schedule:
    - cron: "17 3 * * *"     # every day 03:17 UTC = 05:17 / 06:17 in Cyprus
  workflow_dispatch:          # "Run workflow" button on GitHub
    inputs:
      only:
        description: "Only these shops (space separated, empty = all)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["site/**", "config/**", "data/manual_prices.csv"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Read shops and build website data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m scraper.run --offline
          elif [ -n "${{ github.event.inputs.only }}" ]; then
            python -m scraper.run --only ${{ github.event.inputs.only }}
          else
            python -m scraper.run
          fi

      - name: Save new prices to the repository
        run: |
          git config user.name "compare-cyprus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Prices $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 10
          done

      - name: Keep debug pages if something broke
        if: failure()
        run: |
          for s in starling sarper hapci; do python -m scraper.diagnose $s || true; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug-pages
          path: debug/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
