# Which websites to read every day.
#
# To switch a shop off, set `enabled: false`.
# To add a North shop, copy one block, change the id/name/addresses, and pick
# a `type`:
#   shop_html    any shop with listing pages (works out names/prices itself)
#   woocommerce  WordPress shops (fast JSON feed, falls back to pages)
#   shopify      Shopify shops (full JSON catalogue)
#   ekalathi     the South government price list (only one of these)

ekalathi:
  enabled: true
  type: ekalathi
  side: S
  page_size: 100
  branches_per_product: 8           # cheapest stores kept per product
  always_include_chain_ids: [453, 471]   # Lidl and Alphamega: always fetched and shown
  pinned_stores: [Lidl, AlphaMega]
  # skip_chains: [Metro]               # uncomment to leave chains out

fetch:
  enabled: true
  type: fetchcy                       # South delivery marketplace; reads only pages that look like North products
  side: S
  store: Fetch (South shops)
  # Fetch has ~290,000 product pages, too many for one day. Each day it reads up to
  # `pages_per_day` pages (1 per second) and remembers them, so coverage grows every day:
  pages_per_day: 6000
  max_minutes: 200
  refresh_days: 3                     # prices re-read every 3 days (shops change prices weekly-ish)
  recheck_days: 21                    # pages with no supermarket price are looked at again after 3 weeks
  keep_days: 10                       # a price not re-read for 10 days is dropped
  # only supermarkets, grocers and pharmacies count as a South price (kiosks charge far more)
  seller_include: "supermarket|super market|grocery|mini market|market|melco|cheap basket|etherio|discount store|pharmacy"
  seller_exclude: "periptero|kiosk|bakery|confectionery|pet people|convenience|eat some more|pow!"
  # also read pages for these everyday items (compared as "any brand" in generic_items.yaml)
  staples: [white-sugar, granulated-sugar, table-salt, iodised-salt, red-lentils, chickpeas, tomato-paste,
            tomato-puree, toothpaste, vinegar, bulgur, pourgouri, honey, tea-bags, teabags, black-tea]
  staples_per_word: 40

starling:
  enabled: true
  type: shop_html
  side: N
  store: Starling Supermarket
  town: Alsancak, Girne
  base_url: https://www.starlingsupermarket.com
  start_url: https://www.starlingsupermarket.com/
  category_link: "/kategori/"          # menu links that lead to listing pages
  product_link: "/urun/"               # links that lead to a product page
  page_param: sayfa                    # IdeaSoft shops page with ?sayfa=2
  max_pages: 40
  maps: "https://www.google.com/maps/search/?api=1&query=Starling+Supermarket+Karao%C4%9Flano%C4%9Flu+Cad.+No+68+Alsancak+Girne"
  # selectors:                         # only if the automatic reader gets it wrong
  #   card: ".showcase"
  #   name: ".showcase-title"
  #   price: ".showcase-price-new"

