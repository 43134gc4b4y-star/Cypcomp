# Words that make two products different even with the same brand and size.
# If one name has it and the other doesn't, they are NOT paired.
conflicts: [sugarfree, light, diet, decaf, lactosefree, fullfat, semi, skimmed, gold, classic,
            red, cherry, vanilla, lemon, lime, orange, peach, strawberry, mango,
            mint, menthol, extra, max, sensitive, whitening, kids, junior,
            chicken, beef, salmon, tuna, dark, white, hazelnut, almond, caramel, pistachio]

# Words ignored when comparing names.
stopwords: [the, and, with, of, ile, ve, for, new, yeni, adet, li, lu, pcs, pack, x, tl, eur,
            koli, kampanya, indirim, firsat, promo, offer, tem, temachia, temaxia]

# How similar the rest of the names must be (0 = anything, 1 = identical).
min_similarity: 0.34
