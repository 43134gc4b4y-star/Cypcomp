# Everyday items compared regardless of brand (fruit & veg, eggs, bread...).
# For each side the app takes the cheapest product whose name contains one of
# the `any` words and none of the `not` words, priced per `per` (kg, litre,
# or a fixed number of pieces).
#
# Words are lowercase without accents (ş -> s, ı -> i, ü -> u ...).

- id: tomatoes
  name: Tomatoes
  category: Fruit & veg
  per: kg
  north: {any: [domates], not: [cherry, ceri, kurusu, salca, sos, konserve, rendesi, suyu, pure, ketcap]}
  south: {any: [tomato], not: [cherry, sauce, paste, puree, canned, tin, juice, ketchup, dried, chopped, peeled]}

- id: potatoes
  name: Potatoes
  category: Fruit & veg
  per: kg
  north: {any: [patates], not: [cips, kizartma, dondurulmus, puresi, salata, tatli]}
  south: {any: [potato], not: [crisps, chips, frozen, fries, puree, salad, sweet]}

