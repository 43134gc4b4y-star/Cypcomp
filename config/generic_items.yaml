# Everyday items compared regardless of brand.
# For each side the app takes the cheapest product that matches the rule,
# priced per `per` (kg, l, "100 g", "15 pc", "1 pc" ...).
#
# Rule keys (all words lowercase, no accents: ş->s, ı->i, ü->u, ğ->g, ç->c, ö->o):
#   any:  the name contains at least one of these (word start)
#   all:  a list of lists - the name must contain one word from EACH list
#   not:  the name contains none of these
#   cat:  (South only) the e-kalathi category contains one of these
# End a word with a space ("un ") to match only that whole word.
# The South (e-kalathi) has no fresh fruit or vegetables, so none are listed.

- id: milk
  name: Fresh milk (any brand)
  category: Milk & dairy
  per: l
  north: {any: ["sut ", "suet", "pastorize", "gunluk sut", "uht"], not: [cikolata, kakao, muz, cilek, kahve, toz, ayran, kefir, protein, badem, soya, yulaf, hindistan, sutlu, krema, bebek, devam, keci, mama, latte, puding, sutlac, kek, gofret, cips, biskuvi, laktozsuz, light, yarim, "200 ml", "180 ml"]}
  south: {cat: [fresh milk], not: [chocolate, goat, lactose, light, "0%", skimmed, "1%", "semi"]}

- id: milk-lactose-free
  name: Lactose-free milk (any brand)
  category: Milk & dairy
  per: l
  north: {any: [laktozsuz], all: [[sut]], not: [cikolata, kakao, muz, cilek, kahve, yogurt, peynir]}
  south: {cat: [fresh milk], any: [lactose]}

