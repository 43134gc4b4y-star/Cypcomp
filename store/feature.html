<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Figtree:wght@600&display=block">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:Figtree,sans-serif}
.bg{position:absolute;inset:0;display:flex}.bg i{flex:1}.bg i:first-child{background:#b3264f}.bg i:last-child{background:#0e6a86}
.c{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
h1{font:800 132px/.9 "Barlow Condensed";margin:0;letter-spacing:-.01em}
p{font:700 46px/1 "Barlow Condensed";margin:14px 0 0;opacity:.95}
.st{position:absolute;right:120px;bottom:70px;background:#f5d547;color:#3a3000;padding:12px 22px 14px;border-radius:8px;transform:rotate(-5deg);box-shadow:0 3px 0 rgba(0,0,0,.2);text-align:center}
.st b{display:block;font:800 44px/1 "Barlow Condensed"}.st span{font-size:20px}
.l,.r{position:absolute;top:40px;color:#fff;font:700 34px "Barlow Condensed";letter-spacing:.04em;opacity:.9}.l{left:56px}.r{right:56px}
</style></head><body>
<div class="bg"><i></i><i></i></div>
<div class="l">North</div><div class="r">South</div>
<div class="c"><h1>Compare Cyprus</h1><p>One island, two price tags.</p></div>
<div class="st"><b>€9.58 less</b><span>46% cheaper</span></div>
</body></html>
